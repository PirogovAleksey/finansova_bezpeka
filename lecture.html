<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Лекція з курсу фінансової безпеки та захисту активів.">
  <meta name="author" content="Кафедра ТЕІБ, Ужгородський національний університет">
  <meta name="theme-color" content="#0ea5e9">
  <title>Лекція — Фінансова Безпека</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
</head>
<body>

  <aside>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div class="logo-text">
        Фінансова<br>Безпека
        <span>онлайн-курс</span>
      </div>
    </div>

    <nav aria-label="Головна навігація"></nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Перемкнути тему">
        <svg id="theme-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span id="theme-label">Темна тема</span>
      </button>
    </div>
  </aside>

  <main>
    <div class="lecture-nav-top">
      <a href="index.html" class="back-link">← Назад до лекцій</a>
      <span id="lecture-badge-top" class="lecture-badge"></span>
    </div>

    <article class="lecture-content">
      <h1 id="lecture-title"></h1>
      <div id="lecture-info" class="lecture-info"></div>

      <div id="lecture-locked" class="lecture-locked" style="display:none">
        <div class="lecture-locked-icon">🔒</div>
        <p class="lecture-locked-title">Матеріали цієї лекції<br>ще готуються</p>
        <p id="lecture-locked-desc" class="lecture-locked-desc"></p>
      </div>

      <section id="lecture-overview"></section>
      <section id="lecture-materials"></section>
      <section id="lecture-presentations"></section>
    </article>

    <div class="lecture-nav-bottom">
      <a id="nav-prev" href="#" class="nav-btn">← Попередня</a>
      <a id="nav-next" href="#" class="nav-btn">Наступна →</a>
    </div>

    <footer></footer>
  </main>

  <button class="mobile-theme-toggle" onclick="toggleTheme()" aria-label="Змінити тему">
    <svg id="mobile-theme-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>

  <script src="js/main.js"></script>
  <script src="js/lectures.js"></script>

</body>
</html>
